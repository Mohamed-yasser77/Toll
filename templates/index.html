<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toll System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        .container {
            width: 50%;
            margin: auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        button {
            padding: 10px 15px;
            margin: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        .login-btn {
            background-color: green;
            color: white;
        }
        .register-btn {
            background-color: blue;
            color: white;
        }
        .admin-btn{
            background-color: rgb(25, 26, 8);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome to the Toll System</h2>

        <!-- Form to enter car number and deduct money -->
        <form action="/deduct_money" method="post">
            <input type="text" name="car_no" required placeholder="Enter Car Number">
            <button type="submit">Check & Pay Toll</button>
        </form>

        <!-- Buttons for Login and Register -->
        <div>
            <a href="/login"><button class="login-btn">Login</button></a>
            <a href="/register"><button class="register-btn">Create Account</button></a>
            <a href="/admin"><button class="admin-btn">Admin Login</button></a>
        </div>
    </div>
</body>
</html>
