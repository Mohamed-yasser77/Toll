<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
      }
      .container {
        width: 30%;
        margin: auto;
        padding: 20px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Admin Login</h2>
      <form action="/admin" method="POST">
        <input
          type="email"
          name="email"
          placeholder="Admin Email"
          required
        /><br /><br />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        /><br /><br />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
